<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickTerm</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-180.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<!-- app.css carries the tokens and the base shell. The four below are the
     overhaul layers and load after it on purpose: later wins, so each one
     can restyle its own surface without fighting app.css on specificity. -->
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/menu.css">
<link rel="stylesheet" href="/css/panels.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/browser.css">
<link rel="stylesheet" href="/css/workspace_views.css">
</head>
<body>
<div id="app">
  <aside id="launcher" class="launcher sidebar" aria-label="QuickTerm sidebar"></aside>
  <div class="workspace-shell">
    <main id="grid" class="grid" aria-label="Terminal workspace"></main>
    <div id="zoom-host" class="zoom-host" hidden></div>
    <div id="app-error" class="app-error" role="alert" hidden>
      <span id="app-error-text"></span>
      <button id="app-error-close" type="button" aria-label="Dismiss message">Dismiss</button>
    </div>
  </div>
  <!-- Stands in for the sidebar while it is hidden: a "+" over the terminal's
       left edge that can be dragged up and down by its handle. -->
  <div id="float-launch" class="float-launch" hidden>
    <span class="float-handle" title="Drag up or down" aria-hidden="true"></span>
    <button class="float-new" type="button" title="New terminal (Alt+N) · right-click to show the sidebar" aria-label="New terminal">+</button>
    <button class="float-show" type="button" title="Show sidebar (Alt+Shift+S)" aria-label="Show sidebar">&rsaquo;</button>
  </div>
  <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-webgl.js"></script>
<script src="/vendor/addon-web-links.js"></script>
<script src="/vendor/addon-unicode11.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
